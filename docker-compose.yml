services:
  pastr:
    build: .
    image: pastr:latest
    restart: unless-stopped
    stop_grace_period: 25s # pastr drains open requests for up to 20s
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pastr-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pastr-data:
